<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PerfRadar · GPU 压力测试（WebGL）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0f14; color:#e6edf3; font:16px/1.5 -apple-system,system-ui,sans-serif;
         overflow:hidden; touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; left:0; right:0; top:0; padding:14px 16px;
         background:linear-gradient(180deg,rgba(0,0,0,.72),transparent); }
  #fps { font:700 44px/1 ui-monospace,Menlo,monospace; color:#22d3ee; }
  #meta { margin-top:6px; font:13px ui-monospace,Menlo,monospace; color:#93a4b8; }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; padding:14px 16px;
         background:linear-gradient(0deg,rgba(0,0,0,.72),transparent); }
  button { flex:1; padding:14px 0; font:600 16px system-ui; color:#0b0f14; background:#22d3ee;
           border:0; border-radius:12px; }
  button.off { background:#2b3644; color:#93a4b8; }
  button.hot { background:#f97316; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="fps">--</div>
  <div id="meta">初始化中…</div>
</div>
<div id="bar">
  <button id="b0">低负载</button>
  <button id="b1">中负载</button>
  <button id="b2" class="hot">高负载</button>
</div>

<script>
// 三档负载：iter = 片元着色器迭代次数，passes = 每帧重绘次数
const LEVELS = [
  { name:'低负载', iter:8,   passes:1 },
  { name:'中负载', iter:120, passes:2 },
  { name:'高负载', iter:900, passes:4 },
];
let level = 2;

const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2') || cv.getContext('webgl');
const meta = document.getElementById('meta');
const fpsEl = document.getElementById('fps');

if (!gl) {
  meta.textContent = '此浏览器不支持 WebGL';
  throw new Error('no webgl');
}
const isGL2 = !!cv.getContext('webgl2');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize);
resize();

const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
// 重负载片元：Mandelbrot 迭代，复杂度由 ITER 控制（常量在编译时注入）
function makeFS(iter) {
  return `precision highp float;
uniform vec2 uRes; uniform float uT;
void main(){
  vec2 c = (gl_FragCoord.xy / uRes) * 3.0 - vec2(2.0, 1.0);
  c += vec2(sin(uT*0.35)*0.06, cos(uT*0.27)*0.06);
  vec2 z = vec2(0.0); float n = 0.0;
  for (int i = 0; i < ${iter}; i++) {
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
    if (dot(z,z) > 4.0) { n = float(i); break; }
  }
  float v = n / ${iter}.0;
  gl_FragColor = vec4(v, 0.35 + 0.5*v, 0.85 - 0.5*v, 1.0);
}`;
}

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function buildProgram(iter) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, makeFS(iter)));
  gl.bindAttribLocation(p, 0, 'p');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let prog = null, buf = null, uRes = null, uT = null;
function useLevel(i) {
  level = i;
  const L = LEVELS[i];
  prog = buildProgram(L.iter);
  gl.useProgram(prog);
  if (!buf) {
    buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  }
  uRes = gl.getUniformLocation(prog, 'uRes');
  uT = gl.getUniformLocation(prog, 'uT');
  gl.uniform2f(uRes, cv.width, cv.height);
  [0,1,2].forEach(k => {
    const b = document.getElementById('b' + k);
    b.className = (k === i ? (k === 2 ? 'hot' : '') : 'off');
  });
}
[0,1,2].forEach(k => document.getElementById('b'+k).onclick = () => useLevel(k));
useLevel(level);

let frames = 0, t0 = performance.now(), last = t0;
function frame(now) {
  const L = LEVELS[level];
  gl.uniform1f(uT, (now - t0) / 1000);
  for (let k = 0; k < L.passes; k++) gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;
  if (now - last >= 500) {
    const fps = frames * 1000 / (now - last);
    fpsEl.textContent = fps.toFixed(1) + ' fps';
    meta.textContent = `${isGL2 ? 'WebGL2' : 'WebGL1'} · ${LEVELS[level].name} · `
      + `迭代 ${LEVELS[level].iter} × ${LEVELS[level].passes} pass · ${cv.width}×${cv.height}`;
    frames = 0; last = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
